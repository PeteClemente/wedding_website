<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/gate.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Address Book | Peter &amp; Mary</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div data-include="/partials/nav.html"></div>

  <main>
    <section class="section">
      <div class="container">
        <p class="hero-eyebrow" style="text-align:center;">Save the Date</p>
        <h2 class="script" style="text-align:center;">Address Book</h2>
        <p class="section-intro">Please help us update our address book so we can send you a save-the-date (and, later, your invitation).</p>

        <form class="form" id="rsvp-form">
          <div class="form-row">
            <label for="name">Full Name(s)</label>
            <input type="text" id="name" name="name" required />
          </div>

          <div class="form-row">
            <label for="address">Mailing Address</label>
            <input type="text" id="address" name="address" placeholder="Street address, apt/unit" required />
          </div>

          <div class="form-row">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required />
          </div>

          <div class="form-row">
            <label for="state">State</label>
            <input type="text" id="state" name="state" required />
          </div>

          <div class="form-row">
            <label for="zip">ZIP Code</label>
            <input type="text" id="zip" name="zip" required />
          </div>

          <div class="form-row">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes"></textarea>
          </div>

          <button class="btn" type="submit">Submit</button>
          <p class="form-status" id="rsvp-status"></p>
        </form>
      </div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/rsvp.js"></script>
</body>
</html>
