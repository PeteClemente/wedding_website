<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/gate.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get to the Altar | Peter &amp; Mary</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div data-include="/partials/nav.html"></div>

  <main>
    <section class="section">
      <div class="container">
        <p class="hero-eyebrow" style="text-align:center;">While You Wait</p>
        <h2 class="script" style="text-align:center;">Get to the Altar</h2>
        <p class="section-intro">Help the groom find his way to the bride. Arrow keys / WASD, or the buttons below on mobile.</p>

        <div class="game-stats">
          <span>Moves: <strong id="chase-moves">0</strong></span>
        </div>

        <div class="chase-board">
          <div class="chase-stage">
            <canvas id="chase-canvas"></canvas>
            <div class="chase-confetti" id="chase-confetti" aria-hidden="true"></div>
          </div>
        </div>

        <div class="chase-dpad" aria-hidden="false">
          <span></span>
          <button class="btn btn-secondary" type="button" data-dir="up" aria-label="Move up">&uarr;</button>
          <span></span>
          <button class="btn btn-secondary" type="button" data-dir="left" aria-label="Move left">&larr;</button>
          <button class="btn btn-secondary" type="button" data-dir="down" aria-label="Move down">&darr;</button>
          <button class="btn btn-secondary" type="button" data-dir="right" aria-label="Move right">&rarr;</button>
        </div>

        <p class="game-win" id="chase-win" hidden>He made it! 🤍 See you at the altar, Peter &amp; Mary.</p>

        <p style="text-align:center; margin-top: 1.5rem;">
          <button class="btn btn-secondary" id="chase-restart" type="button">Restart</button>
        </p>
      </div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/chase.js"></script>
</body>
</html>
