<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/assets/js/gate.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play a Game | Peter &amp; Mary</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div data-include="/partials/nav.html"></div>

  <main>
    <section class="section">
      <div class="container">
        <p class="hero-eyebrow" style="text-align:center;">While You Wait</p>
        <h2 class="script" style="text-align:center;">Memory Match</h2>
        <p class="section-intro">Flip the cards and find all the matching pairs!</p>

        <div class="game-stats">
          <span>Moves: <strong id="game-moves">0</strong></span>
          <span>Time: <strong id="game-time">0</strong>s</span>
        </div>

        <div class="game-board" id="game-board"></div>

        <p class="game-win" id="game-win" hidden>You matched them all! 🎉 Just like Peter &amp; Mary.</p>

        <p style="text-align:center; margin-top: 1.5rem;">
          <button class="btn btn-secondary" id="game-restart" type="button">Restart</button>
        </p>
      </div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/game.js"></script>
</body>
</html>
