<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Peter &amp; Mary</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <main>
    <section class="hero">
      <div class="container">
        <p class="hero-eyebrow">Peter &amp; Mary</p>
        <h1 style="font-size: clamp(2rem, 5vw, 3rem);">This page is locked</h1>
        <p class="hero-date">Please enter the password from your invitation to continue.</p>

        <form class="form password-form" id="password-form">
          <div class="form-row">
            <label for="site-password">Password</label>
            <input type="password" id="site-password" name="password" required autofocus autocomplete="off" />
          </div>
          <button class="btn" type="submit">Enter</button>
          <p class="form-status" id="password-status"></p>
        </form>
      </div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/password.js"></script>
</body>
</html>
