<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Peter &amp; Mary</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <div data-include="/partials/nav.html"></div>

  <main>
    <section class="section">
      <div class="container">
        <p class="hero-eyebrow" style="text-align:center;">Photos</p>
        <h2 style="text-align:center;">Gallery</h2>
        <p class="section-intro">A few of our favorite moments together.</p>

        <div class="gallery-grid">
          <button class="gallery-item" type="button">
            <div class="placeholder-box">Add Photo 1</div>
            <figcaption>Caption goes here</figcaption>
          </button>
          <button class="gallery-item" type="button">
            <div class="placeholder-box">Add Photo 2</div>
            <figcaption>Caption goes here</figcaption>
          </button>
          <button class="gallery-item" type="button">
            <div class="placeholder-box">Add Photo 3</div>
            <figcaption>Caption goes here</figcaption>
          </button>
          <button class="gallery-item" type="button">
            <div class="placeholder-box">Add Photo 4</div>
            <figcaption>Caption goes here</figcaption>
          </button>
        </div>

        <p style="text-align:center;">
          <span class="todo-note">📝 TODO: replace placeholder boxes with real photos — put image files in assets/img/ and swap each placeholder-box div for &lt;img src="/assets/img/yourphoto.jpg" alt="..."&gt;.</span>
        </p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <img class="lightbox-image" src="" alt="" />
      <p class="lightbox-caption"></p>
    </div>
    <button class="lightbox-close" aria-label="Close">&times;</button>
  </div>

  <div data-include="/partials/footer.html"></div>

  <script src="/assets/js/include.js"></script>
  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/gallery.js"></script>
</body>
</html>
